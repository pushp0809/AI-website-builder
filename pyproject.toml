[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsite"
version = "0.1.0"
description = "Multi-agent website-building framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.3",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "black>=24.1.0",
    "flake8>=7.0.0",
    "bandit>=1.7.5",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.41.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsite*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
